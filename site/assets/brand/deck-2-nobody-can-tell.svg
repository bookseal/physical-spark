<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"><title>Nobody can tell who is qualified</title>
  <style>
    /* Loops, not one-shots — a beat is hidden until shown but the SVG keeps running.
       The resting state is the finished drawing; only keyframes take anything away. */
    @media (prefers-reduced-motion: reduce){ * { animation: none !important; } }
    .pick{animation:lift 4.4s ease-in-out infinite;}
    @keyframes lift{0%,62%,100%{transform:translateY(0)}30%{transform:translateY(-18px)}}
    .ask{animation:lean 4.4s ease-in-out infinite; transform-origin:492px 130px;}
    @keyframes lean{0%,100%{transform:rotate(0)}42%{transform:rotate(-8deg)}72%{transform:rotate(4deg)}}
  </style>
