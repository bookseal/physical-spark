<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
  <title>Three stacked bars, the middle one marked in red</title>
  <g fill="none" stroke="#2b211a" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="7">
      <rect x="128" y="62"  width="52" height="46" rx="12" fill="#fbf5e9"/>
      <rect x="196" y="62"  width="404" height="46" rx="23" fill="#fbf5e9"/>
    </g>
    <g stroke-width="9" stroke="#e0442e">
      <rect x="128" y="128" width="52" height="46" rx="12" fill="#fbf5e9"/>
      <rect x="196" y="128" width="404" height="46" rx="23" fill="#fbf5e9"/>
    </g>
    <g stroke-width="7">
      <rect x="128" y="194" width="52" height="46" rx="12" fill="#fbf5e9"/>
      <rect x="196" y="194" width="404" height="46" rx="23" fill="#fbf5e9"/>
    </g>
  </g>
</svg>
