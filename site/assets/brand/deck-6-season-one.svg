<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"><title>One season with a finite grid and a marked endpoint</title>
  <style>
    /* Loops, not one-shots — a beat is hidden until shown but the SVG keeps running.
       The resting state is the finished drawing; only keyframes take anything away. */
    @media (prefers-reduced-motion: reduce){ * { animation: none !important; } }
    .joined{animation:arrive 5s ease-in-out infinite;}
    .joined:nth-of-type(2){animation-delay:.55s} .joined:nth-of-type(3){animation-delay:1.1s}
    @keyframes arrive{0%,8%{opacity:0}20%,88%{opacity:1}96%,100%{opacity:0}}
  </style>
