<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
  <title>A short stack of budget beside a much taller one, with the tall stack still growing</title>
  <style>
    /* Loops, not one-shots — a beat is hidden until shown but the SVG keeps running.
       The resting state is the finished drawing; only keyframes take anything away. */
    @media (prefers-reduced-motion: reduce){ * { animation: none !important; } }
    .grow rect{animation:stack 5s ease-in-out infinite;}
    .grow rect:nth-child(2){animation-delay:.12s} .grow rect:nth-child(3){animation-delay:.24s}
    .grow rect:nth-child(4){animation-delay:.36s} .grow rect:nth-child(5){animation-delay:.48s}
    .grow rect:nth-child(6){animation-delay:.6s}  .grow rect:nth-child(7){animation-delay:.72s}
    @keyframes stack{0%,6%{opacity:0;transform:translateY(14px)}20%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(14px)}}
  </style>
  <g fill="none" stroke="#2b211a" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">

    <!-- the floor they both sit on -->
    <path d="M56 262h608" stroke-width="5"/>

    <!-- the small one: a training budget -->
    <rect x="112" y="222" width="176" height="32" rx="8" fill="#fbf5e9"/>
    <rect x="112" y="182" width="176" height="32" rx="8" fill="#fbf5e9"/>

    <!-- the one they are already spending -->
    <g class="grow" stroke="#e0442e">
      <rect x="424" y="222" width="176" height="32" rx="8" fill="#fbf5e9"/>
      <rect x="424" y="182" width="176" height="32" rx="8" fill="#fbf5e9"/>
      <rect x="424" y="142" width="176" height="32" rx="8" fill="#fbf5e9"/>
      <rect x="424" y="102" width="176" height="32" rx="8" fill="#fbf5e9"/>
      <rect x="424" y="62" width="176" height="32" rx="8" fill="#fbf5e9"/>
      <rect x="424" y="22" width="176" height="32" rx="8" fill="#fbf5e9"/>
    </g>
  </g>
</svg>
