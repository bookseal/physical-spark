<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
  <title>An open laptop on one side, and on the other someone standing at a locked barrier with their eyes down, the robot arm plainly visible behind it</title>
  <style>
    /* Loops, not one-shots — a beat is hidden until shown but the SVG keeps running.
       The resting state is the finished drawing; only keyframes take anything away. */
    @media (prefers-reduced-motion: reduce){ * { animation: none !important; } }
    .spark{animation:spark 3.4s ease-in-out infinite;}
    @keyframes spark{0%,100%{opacity:.35;transform:translateY(3px)}45%{opacity:1;transform:translateY(-3px)}}
    .lock{animation:rattle 3.4s ease-in-out infinite; transform-origin:660px 234px;}
    @keyframes rattle{0%,54%,100%{transform:rotate(0)}60%{transform:rotate(-5deg)}66%{transform:rotate(5deg)}72%{transform:rotate(-3deg)}}
    /* the ears warm and cool — nobody senior says they do not know where to start */
    .ears{animation:warm 3.4s ease-in-out infinite;}
    @keyframes warm{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <g fill="none" stroke="#2b211a" stroke-linecap="round" stroke-linejoin="round">

    <!-- LEFT: a laptop. Open, on, nothing in the way. -->
    <g stroke-width="8">
      <path d="M86 112h124a10 10 0 0 1 10 10v70H76v-70a10 10 0 0 1 10-10z" fill="#fbf5e9"/>
      <path d="M58 216h180l14 18H44z" fill="#fbf5e9"/>
    </g>
    <g stroke="#0e9a89" stroke-width="7" class="spark">
      <path d="M148 72v20M116 84l10 15M180 84l-10 15"/>
    </g>

    <path d="M300 54v196" stroke-width="4" stroke-dasharray="10 12"/>

    <!-- the person, on this side of it, not asking -->
    <circle cx="382" cy="176" r="42" fill="#e6a413" stroke-width="7"/>
    <path d="M364 168q9 8 18 0" stroke-width="6"/>
    <path d="M386 168q9 8 18 0" stroke-width="6"/>
    <path d="M368 198h28" stroke-width="6"/>
    <g class="ears" stroke="#e0442e" stroke-width="6">
      <path d="M340 180q-5 6 0 12M424 180q5 6 0 12"/>
    </g>

    <!-- the arm, plainly visible, and out of reach -->
    <g stroke-width="10">
      <path d="M552 244v-70"/>
      <path d="M552 174l50-46"/>
      <path d="M602 128l42 16"/>
    </g>
    <g stroke-width="8">
      <path d="M644 144l20-16M644 144l4 24"/>
      <path d="M520 250h64" stroke-width="11"/>
    </g>
    <circle cx="552" cy="174" r="8" fill="#fbf5e9" stroke-width="7"/>

    <!-- the barrier between them -->
    <g stroke="#e0442e" stroke-width="9">
      <path d="M446 120v134M676 120v134"/>
      <path d="M446 200h230"/>
    </g>
    <g stroke-width="7" class="lock">
      <path d="M646 204a16 16 0 0 1 32 0v10"/>
      <path d="M640 214h44a7 7 0 0 1 7 7v28a7 7 0 0 1-7 7h-44a7 7 0 0 1-7-7v-28a7 7 0 0 1 7-7z" fill="#fbf5e9"/>
    </g>
  </g>
</svg>
