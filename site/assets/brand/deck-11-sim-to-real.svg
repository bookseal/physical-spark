<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
  <title>Him alone at a screen with a simulated arm inside it, and the same arm standing real on the other side</title>
  <style>
    /* Loops, not one-shots — a beat is hidden until shown but the SVG keeps running.
       The resting state is the finished drawing; only keyframes take anything away. */
    @media (prefers-reduced-motion: reduce){ * { animation: none !important; } }
    .sim{animation:sim 4.2s ease-in-out infinite;}
    @keyframes sim{0%,100%{opacity:1}56%,76%{opacity:.3}}
    .cross{animation:cross 4.2s ease-in-out infinite;}
    @keyframes cross{0%,30%{transform:translateX(0);opacity:1}62%,100%{transform:translateX(24px);opacity:.25}}
    .real path{stroke-dasharray:120; stroke-dashoffset:0; animation:build 4.2s ease-in-out infinite;}
    @keyframes build{0%,34%{stroke-dashoffset:120}58%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:120}}
    .glow{animation:glow 4.2s ease-in-out infinite;}
    @keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
  </style>
  <g fill="none" stroke="#2b211a" stroke-linecap="round" stroke-linejoin="round">

    <!-- HIM. Alone, at night, starting anyway. The only move he makes himself. -->
    <g stroke-width="7">
      <circle cx="84" cy="176" r="38" fill="#e6a413"/>
      <path d="M64 144q5-17 23-13" stroke-width="6"/>
      <circle cx="84" cy="170" r="5" fill="#2b211a" stroke="none"/>
      <circle cx="108" cy="170" r="5" fill="#2b211a" stroke="none"/>
      <path d="M82 198q12 6 22 0" stroke-width="6"/>
    </g>
    <g class="glow" stroke="#0e9a89" stroke-width="6">
      <path d="M132 158h18M132 186h18"/>
    </g>

    <!-- the simulator -->
    <g stroke-width="8">
      <path d="M172 76h190a12 12 0 0 1 12 12v112a12 12 0 0 1-12 12H172a12 12 0 0 1-12-12V88a12 12 0 0 1 12-12z" fill="#fbf5e9"/>
      <path d="M266 212v16M232 244h68" stroke-width="7"/>
    </g>
    <g stroke-width="7" stroke-dasharray="9 9" class="sim">
      <path d="M232 186v-36"/>
      <path d="M232 150l34-30"/>
      <path d="M266 120l30 10"/>
      <path d="M208 186h48"/>
    </g>

    <!-- out of the screen -->
    <g class="cross">
      <path d="M394 150h48" stroke="#e0442e" stroke-width="9"/>
      <path d="M442 150l-18-12v24z" fill="#e0442e" stroke="#e0442e" stroke-width="7"/>
    </g>

    <!-- the real one -->
    <g stroke="#e0442e" stroke-width="11" class="real">
      <path d="M528 240v-54"/>
      <path d="M528 186l48-42"/>
      <path d="M576 144l42 14"/>
    </g>
    <g stroke="#e0442e" stroke-width="8">
      <path d="M618 158l18-14M618 158l4 24"/>
    </g>
    <path d="M494 246h68" stroke-width="11"/>
    <circle cx="528" cy="186" r="8" fill="#fbf5e9" stroke-width="7"/>
  </g>
</svg>
