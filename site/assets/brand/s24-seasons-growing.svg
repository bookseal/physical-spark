<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
  <title>Eight bars on a baseline, each taller than the last, with the final three in red</title>
  <style>
    @media (prefers-reduced-motion: reduce){ * { animation: none !important; } }
    .g rect{animation:rise 5.4s ease-in-out infinite; transform-origin:center bottom;}
    .g rect:nth-child(2){animation-delay:.14s} .g rect:nth-child(3){animation-delay:.28s}
    .g rect:nth-child(4){animation-delay:.42s} .g rect:nth-child(5){animation-delay:.56s}
    .g rect:nth-child(6){animation-delay:.7s}  .g rect:nth-child(7){animation-delay:.84s}
    .g rect:nth-child(8){animation-delay:.98s}
    @keyframes rise{0%,4%{transform:scaleY(.06)}18%,90%{transform:scaleY(1)}98%,100%{transform:scaleY(.06)}}
  </style>
  <g fill="none" stroke="#2b211a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 262h616" stroke-width="6"/>
    <g class="g" stroke-width="7">
      <rect x="72"  y="234" width="52" height="28"  rx="10" fill="#fbf5e9"/>
      <rect x="150" y="216" width="52" height="46"  rx="10" fill="#fbf5e9"/>
      <rect x="228" y="192" width="52" height="70"  rx="10" fill="#fbf5e9"/>
      <rect x="306" y="162" width="52" height="100" rx="10" fill="#fbf5e9"/>
      <rect x="384" y="128" width="52" height="134" rx="10" fill="#fbf5e9"/>
      <rect x="462" y="96"  width="52" height="166" rx="10" fill="#fbf5e9" stroke="#e0442e"/>
      <rect x="540" y="66"  width="52" height="196" rx="10" fill="#fbf5e9" stroke="#e0442e"/>
      <rect x="618" y="38"  width="52" height="224" rx="10" fill="#fbf5e9" stroke="#e0442e"/>
    </g>
  </g>
</svg>
