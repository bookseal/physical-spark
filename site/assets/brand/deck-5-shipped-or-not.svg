<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"><title>What exists versus what is intended</title>
  <style>
    /* Loops, not one-shots — a beat is hidden until shown but the SVG keeps running.
       The resting state is the finished drawing; only keyframes take anything away. */
    @media (prefers-reduced-motion: reduce){ * { animation: none !important; } }
    .ok{stroke-dasharray:56; stroke-dashoffset:0; animation:mark 4.8s ease-in-out infinite;}
    @keyframes mark{0%,10%{stroke-dashoffset:56}26%,86%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:56}}
    .todo{animation:breathe 4.8s ease-in-out infinite;}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
  </style>
<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M360 60v180" stroke="#2b211a" stroke-width="5"/><rect x="100" y="82" width="188" height="34" rx="10" stroke="#2b211a" stroke-width="5"/><rect x="100" y="132" width="188" height="34" rx="10" stroke="#2b211a" stroke-width="5"/><rect x="100" y="182" width="188" height="34" rx="10" stroke="#2b211a" stroke-width="5"/><path class="ok" d="M138 99l12 12 24-24M138 149l12 12 24-24M138 199l12 12 24-24" stroke="#0e9a89" stroke-width="6"/><rect class="todo" x="400" y="82" width="188" height="34" rx="10" stroke="#2b211a" stroke-width="5" stroke-dasharray="10 10"/><rect class="todo" x="400" y="132" width="188" height="34" rx="10" stroke="#2b211a" stroke-width="5" stroke-dasharray="10 10"/><rect class="todo" x="400" y="182" width="188" height="34" rx="10" stroke="#2b211a" stroke-width="5" stroke-dasharray="10 10"/></g></svg>
