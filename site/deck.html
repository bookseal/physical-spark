<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physical Spark — the 10-minute pitch</title>
<meta name="description" content="Physical Spark — three groups need the same engineer, and we are where all three meet.">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   DECK v3 — built from docs/01-concept/deck-v3-spec.md
   30 slides (23 content + 7 chapter dividers), exactly 600 seconds.

   Palette and warmth come from deck.html (v1): a cream page, and only v1's five
   accents — red, gold, amber, teal, blue. The accent belongs to the CHAPTER, so
   "coloured means important" holds for a whole section rather than resetting
   every slide; the colour changing IS the signal that a section changed.

   Sized in `cqw` so a laptop and a projector render identical proportions.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --ink:#2b211a; --body:#5a4c3e; --mute:#948468; --line:#e8dcc4;
  --page:#fbf5e9;        /* one cream sheet, edge to edge */
  --card:#ffffff;        /* the only white on screen, so cards lift */
  --dot:#c3b294;         /* bullet dots — deliberately NOT the accent */
  --accent:#e0442e;      /* replaced per chapter at render time */
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--page);color:var(--ink);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}

/* ── HUD: the chapter rail doubles as the time budget ─────────────────────── */
.hud{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--page);border-bottom:1px solid var(--line);}
.hud-in{display:flex;align-items:center;gap:14px;padding:9px 18px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap;color:var(--ink);text-decoration:none;}
.brand img{height:22px;width:auto;display:block;}
.brand b{color:#e0442e;}
.rail{flex:1;display:flex;gap:10px;min-width:200px;}
.ch{flex:var(--w);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;}
.ch .nm{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:#bcac90;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch.live .nm{color:var(--c);}
.ch.done .nm{color:var(--mute);}
.ch .bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;}
.ch .bar i{display:block;height:100%;width:0;background:var(--c);}
/* The clock is rehearsal equipment, not part of the talk. It sat top right, which
   is where a room looks when a slide changes — so a judge watched the presenter
   run out of time. Down here it is small, grey, and in the presenter's own corner.
   Hidden with visibility, not display, so the buttons beside it never shift. */
.clock{font-weight:700;font-size:12px;min-width:76px;text-align:left;color:var(--mute);
  font-variant-numeric:tabular-nums;}
.clock.over{color:#e0442e;}
body.notime .clock{visibility:hidden;}
.tbtn{border:1px solid var(--line);background:#fff;color:var(--body);border-radius:8px;
  padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;}
.tbtn:hover{border-color:var(--accent);color:var(--accent);}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}

/* the solution rail — thin, quiet, and identical on every slide of the chapter,
   because its job is to hold a position, not to be looked at. The live box is
   filled; the ones behind it keep their outline so progress reads left to right. */
.srail{display:flex;align-items:center;gap:.9cqw;margin-top:1.1cqw;}
/* the rail costs height, so the body it sits above gives some back */
.srail + .body{margin-top:1.5cqw;}
.sbox{display:flex;align-items:baseline;gap:.7cqw;border:1.5px solid var(--line);
  border-radius:.8cqw;padding:.45cqw 1.1cqw;background:var(--card);min-width:12cqw;}
.sbox b{font-size:1.35cqw;font-weight:800;color:var(--mute);font-family:ui-monospace,monospace;}
.sbox span{font-size:1.55cqw;font-weight:700;color:var(--body);}
.sbox.seed{border-style:dashed;background:none;}
.sbox.seed b{color:#c9b795;}
.sbox.done{border-color:var(--accent);}
.sbox.done b,.sbox.done span{color:var(--accent);}
.sbox.now{background:var(--accent);border-color:var(--accent);}
.sbox.now b{color:rgba(255,255,255,.75);}
.sbox.now span{color:#fff;}
.sar{font-style:normal;font-size:1.55cqw;font-weight:800;color:var(--line);}
.divider .srail{margin-top:3.4cqw;}
.divider .sbox{padding:1.1cqw 1.8cqw;min-width:17cqw;}
.divider .sbox span{font-size:2.4cqw;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
.divider .sbox b{font-size:1.6cqw;}
.divider .sar{font-size:2.4cqw;}   /* left, under the sub — the headline sets the edge */

/* ── stage ────────────────────────────────────────────────────────────────── */
.wrap{position:absolute;inset:44px 0 var(--btm,52px);display:grid;place-items:center;padding:14px;}
/* max-width derives from the height actually left over — the slide is as wide
   as 16:9 allows once the HUD and the control bar have taken their strip. */
.stage{width:100%;
  max-width:calc((100vh - 44px - var(--btm,52px) - 28px) * 16 / 9);
  aspect-ratio:16/9;background:var(--page);
  container-type:inline-size;position:relative;overflow:hidden;}
/* the running screen number — outside .slide so cover, dividers and outro
   carry it too, and so it never moves when a layout changes */
.pgno{position:absolute;right:6cqw;bottom:.6cqw;z-index:5;
  font-size:1.55cqw;font-weight:800;letter-spacing:-.01em;color:var(--ink);opacity:.42;}
.pgno small{font-size:1.35cqw;font-weight:700;opacity:.65;}
.slide{position:absolute;inset:0;padding:0.6cqw 6cqw 11.5cqw;display:none;flex-direction:column;z-index:1;}
.slide.on{display:flex;animation:in 0.43s cubic-bezier(.2,.9,.3,1);}
@keyframes in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none;}}

.kick{display:flex;align-items:center;gap:1.1cqw;margin-bottom:2.1cqw;}
.kick .n{background:var(--accent);color:#fff;border-radius:99px;min-width:2.9cqw;
  padding:.35cqw .8cqw;text-align:center;font-size:1.4cqw;font-weight:800;letter-spacing:.06em;}
.kick .l{font-size:1.43cqw;font-weight:700;letter-spacing:.18em;color:var(--mute);text-transform:uppercase;}
.kick .rule{flex:1;height:1px;background:var(--line);}
.kick .s{font-size:1.38cqw;font-weight:700;color:var(--mute);}
/* a slide still being argued about says so, in the one place the eye starts.
   Delete the beat's `fix:` field and the badge goes with it. */
.kick .fix{background:#e0442e;color:#fff;font-size:1.38cqw;font-weight:800;letter-spacing:.14em;
  padding:.25cqw .7cqw;border-radius:.4cqw;}
h1{margin:0;font-size:5.05cqw;line-height:1.07;letter-spacing:-.03em;font-weight:800;}
h1 em{font-style:normal;color:var(--accent);}
.sub{margin:1.1cqw 0 0;font-size:1.85cqw;line-height:1.45;color:var(--body);max-width:66cqw;}

/* ── LAYOUTS ──────────────────────────────────────────────────────────────────
   The layout follows the SHAPE OF THE ARGUMENT, never variety for its own sake.
   Parallel facts → cards. A sequence → flow. A contrast → compare. Time → axis.
   One dominant figure → bignum. Narrowing → funnel. Growth → bars.
   Get this right and the script gets shorter: an arrow says "then" for free.
   ──────────────────────────────────────────────────────────────────────────── */
.body{margin-top:3cqw;flex:1;min-height:0;}
/* the stats slide lost its sub line, so the figures sat straight under the
   headline with nothing between them. The gap the sub used to hold stays. */
.slide.lay-stats .body,.slide.lay-stack .body,.slide.lay-table .body,
.slide.lay-pays .body,.slide.lay-tlbare .body{margin-top:6cqw;}

/* A · cards */
.cards{display:grid;gap:1.6cqw;align-items:stretch;height:auto;}
.cards.c2{grid-template-columns:repeat(2,1fr);}
.cards.c3{grid-template-columns:repeat(3,1fr);}
.cards.c4{grid-template-columns:repeat(4,1fr);}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:1.1cqw;
  padding:2cqw 2cqw 2.2cqw;display:flex;flex-direction:column;gap:.8cqw;
  transition:transform .26s cubic-bezier(.2,.9,.3,1),background .26s,border-color .26s,box-shadow .26s;}
.card .k{font-size:1.53cqw;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
.card .big{font-size:3.1cqw;font-weight:800;letter-spacing:-.03em;line-height:1.02;color:var(--ink);}
.cards.c2 .card .big{font-size:3.7cqw;}
.cards.c4 .card .big{font-size:2.4cqw;}
.card ul{list-style:none;margin:1.1cqw 0 0;padding:0;display:flex;flex-direction:column;gap:.7cqw;}
.card li{position:relative;padding-left:1.65cqw;font-size:1.65cqw;line-height:1.3;color:var(--body);}
.card li::before{content:'';position:absolute;left:0;top:.72cqw;width:.5cqw;height:.5cqw;
  border-radius:50%;background:var(--dot);}
/* the filled card lifts and grows enough to read from the back of a room; z-index
   keeps it above its neighbours once it overlaps the gap */
.card.focus{background:var(--accent);border-color:var(--accent);position:relative;z-index:2;
  transform:translateY(-.6cqw) scale(1.05);box-shadow:0 1.6cqw 3.4cqw rgba(120,80,20,.26);}
.card.focus .k{color:rgba(255,255,255,.75);}
.card.focus .big,.card.focus li{color:#fff;}
.card.focus li::before{background:rgba(255,255,255,.8);}
/* the empty seat — a card that is deliberately not there */
.card.ghost{background:transparent;border-style:dashed;border-color:var(--accent);}
.card.ghost .k,.card.ghost .big{color:var(--accent);}

/* B · compare */
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:2cqw;align-items:stretch;height:auto;}
.cmp .vs{align-self:center;font-size:1.45cqw;font-weight:800;letter-spacing:.2em;color:var(--mute);}

/* C · flow */
.flow{display:flex;align-items:stretch;gap:1.3cqw;height:auto;}
.flow .card{flex:1;padding:1.5cqw 1.6cqw 1.7cqw;}
/* three cards, one baseline: the label and the title each keep their own slot
   whether they run to one line or two, so the bullets start level across all
   three. Without this a longer country name pushes its whole card down. */
.flow .card .flag{font-size:2.9cqw;line-height:1;margin-bottom:.1cqw;}
.flow .card .k{min-height:4cqw;}
.flow .card .big{min-height:5.6cqw;font-size:2.8cqw;}
.flow .arw{align-self:center;font-size:2.6cqw;line-height:1;color:var(--dot);}

/* D · timeline */
.tl{position:relative;padding-top:3.4cqw;display:flex;gap:1.8cqw;height:100%;}
.tl::before{content:'';position:absolute;left:6%;right:6%;top:1.5cqw;height:2px;background:var(--line);}
.tl .mk{flex:1;position:relative;display:flex;}
.tl .mk::after{content:'';position:absolute;top:-2.6cqw;left:50%;transform:translateX(-50%);
  width:1.3cqw;height:1.3cqw;border-radius:50%;background:var(--line);
  box-shadow:0 0 0 .4cqw var(--page);}
.tl .mk.on::after{background:var(--accent);}
.tl .card{flex:1;}

/* E · bars — the label and caption live UNDER a shared baseline, not inside the
   column. A 19%-tall bar cannot hold three lines of text, and squeezing them in
   clipped the shortest year on both bar slides. */
.bars{display:flex;align-items:stretch;gap:1.8cqw;height:100%;}
.bars .col{flex:1;display:flex;flex-direction:column;min-width:0;}
.bars .plot{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;}
.bars .val{font-size:2.6cqw;font-weight:800;letter-spacing:-.03em;color:var(--ink);
  text-align:center;margin-bottom:.7cqw;}
.bars .col.focus .val{color:var(--accent);}
.bars .bar{height:var(--h);background:var(--card);border:1.5px solid var(--line);border-bottom:none;
  border-radius:1.1cqw 1.1cqw 0 0;}
.bars .col.focus .bar{background:var(--accent);border-color:var(--accent);}
.bars .under{border-top:2px solid var(--line);padding-top:1cqw;}
.bars .col.focus .under{border-top-color:var(--accent);}
.bars .k{font-size:1.5cqw;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
.bars .col.focus .k{color:var(--accent);}
.bars .cap{margin-top:.5cqw;font-size:1.58cqw;color:var(--body);line-height:1.32;}

/* F · funnel — only the label and the figure ride inside the bar. The sentence
   explaining the arithmetic sits outside it, full width, so the narrowest tier
   does not squeeze its own caption into four lines. */
.fun{display:flex;flex-direction:column;gap:.9cqw;justify-content:center;height:100%;}
.fun .row{display:grid;grid-template-columns:8.5cqw 1fr;gap:1.8cqw;align-items:start;}
.fun .col{display:flex;flex-direction:column;gap:.45cqw;min-width:0;}
.fun .tier{width:var(--w);background:var(--card);border:1.5px solid var(--line);border-radius:1cqw;
  padding:1cqw 1.8cqw;display:flex;align-items:baseline;}
.fun .k{font-size:2.1cqw;font-weight:800;letter-spacing:.08em;color:var(--mute);padding-top:.75cqw;}
.fun .row.focus .k{color:var(--accent);}
.fun .big{font-size:3.2cqw;font-weight:800;letter-spacing:-.03em;color:var(--ink);}
.fun .cap{font-size:1.65cqw;color:var(--body);line-height:1.35;}
.fun .tier.focus{background:var(--accent);border-color:var(--accent);
  box-shadow:0 1.2cqw 2.6cqw rgba(120,80,20,.24);}
.fun .tier.focus .big{color:#fff;}
.fun .row.focus .cap{color:var(--ink);font-weight:500;}

/* G · bignum */
.bignum{display:flex;align-items:center;gap:4cqw;height:100%;}
.bignum .n{flex:0 0 34cqw;font-size:10.5cqw;font-weight:800;line-height:.86;
  letter-spacing:-.05em;color:var(--accent);font-variant-numeric:tabular-nums;}
.bignum .side{flex:1;}
.bignum .unit{font-size:2.6cqw;font-weight:800;letter-spacing:-.02em;color:var(--ink);
  margin-bottom:1.5cqw;line-height:1.25;}
.bignum ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8cqw;}
.bignum li{position:relative;padding-left:1.8cqw;font-size:1.75cqw;line-height:1.35;color:var(--body);}
.bignum li::before{content:'';position:absolute;left:0;top:.75cqw;width:.5cqw;height:.5cqw;
  border-radius:50%;background:var(--dot);}

/* G′ · density — one robot standing beside eight people. The workers arrive
   left to right and the arm lands last, so the room watches it take its place
   in the line instead of being told a ratio. */
.dens{display:flex;flex-direction:column;gap:1.9cqw;height:100%;justify-content:center;}
.crowd{display:flex;align-items:flex-end;gap:.9cqw;flex-wrap:nowrap;}
.crowd svg{height:8.2cqw;width:auto;flex:none;color:#cdbb9a;}
.crowd .bar{width:1.5px;align-self:stretch;background:var(--line);margin:0 1.2cqw;}
.crowd svg.arm{color:var(--accent);height:9.6cqw;}
.slide.on .crowd svg{animation:stand 0.59s cubic-bezier(.2,.8,.3,1) both;
  animation-delay:calc(var(--i) * 0.11s + 0.19s);}
@keyframes stand{from{opacity:0;transform:translateY(1.4cqw);}to{opacity:1;transform:none;}}
.slide.on .crowd svg.arm{animation:armin 0.81s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:1.21s;}
@keyframes armin{from{opacity:0;transform:scale(.68) translateY(1.8cqw);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){ .slide.on .crowd svg{animation:none;} }
.dens .cap{font-size:2.6cqw;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.25;}
.dens .cap b{color:var(--accent);}
.dens ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.75cqw;}
.dens li{position:relative;padding-left:1.8cqw;font-size:1.7cqw;line-height:1.35;color:var(--body);}
.dens li::before{content:'';position:absolute;left:0;top:.72cqw;width:.5cqw;height:.5cqw;
  border-radius:50%;background:var(--dot);}

/* H · document (the scorecard) */
.doc{background:var(--card);border:1.5px solid var(--line);border-top:.35cqw solid var(--accent);
  border-radius:.9cqw;padding:1.1cqw 1.8cqw 1cqw;height:auto;display:flex;flex-direction:column;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
.doc .hd{font-size:2cqw;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.1;}
.doc .hdsub{font-size:1.5cqw;font-weight:700;color:var(--mute);margin-top:.2cqw;
  padding-bottom:.5cqw;margin-bottom:.5cqw;border-bottom:.22cqw solid var(--accent);}
.doc .ln{display:flex;justify-content:space-between;gap:2cqw;font-size:1.5cqw;
  padding:.14cqw 0;color:var(--ink);}
.doc .ln .v{font-weight:700;white-space:nowrap;}
.doc .ln.good .v{color:#0e9a89;}
.doc .ln.bad .v{color:#e0442e;}
.doc .vd{display:flex;justify-content:space-between;gap:2cqw;margin-top:.45cqw;padding-top:.6cqw;
  border-top:1px solid var(--line);font-size:1.7cqw;font-weight:800;color:var(--accent);}
.doc .ft{font-size:1.38cqw;color:var(--mute);margin-top:.55cqw;}

/* I · people */
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:2cqw;height:auto;}
/* a portrait + four bullets is the densest card in the deck, so it gets its own,
   tighter scale — otherwise it runs 23px past the body and over the footer */
.people .card{padding:1.5cqw 1.8cqw 1.6cqw;gap:.4cqw;}
.people .card .big{font-size:2.5cqw;}
.people .card ul{margin-top:.85cqw;gap:.6cqw;}
.people .card li{font-size:1.55cqw;line-height:1.32;}
/* the employer marks from deck.html — they say in one glance what a bullet needs
   a line for, so one bullet each was dropped to pay for the row */
.people .org{display:flex;align-items:center;gap:1.6cqw;margin-top:1cqw;padding-top:1.1cqw;
  border-top:1px solid var(--line);}
.people .org img{height:2cqw;width:auto;max-width:8cqw;object-fit:contain;display:block;opacity:.85;}
.people .hdr{display:flex;align-items:center;gap:1.4cqw;margin-bottom:.7cqw;}
.people .face{flex:none;width:4.8cqw;height:4.8cqw;border-radius:50%;object-fit:cover;
  border:1.5px solid var(--line);}

/* J · venn — three groups, one overlap */
.venn{display:flex;align-items:center;gap:3.5cqw;height:auto;}
.venn .fig{position:relative;width:31cqw;height:27cqw;flex:none;}
.venn .c{position:absolute;width:18.5cqw;height:18.5cqw;border-radius:50%;mix-blend-mode:multiply;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:1.53cqw;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5a4c3e;}
.venn .c1{left:0;top:0;background:#f7d9a4;}
.venn .c2{right:0;top:0;background:#f5c3b8;}
.venn .c3{left:6.25cqw;bottom:0;background:#bfe1dd;}
.venn .c1 span{transform:translate(-1.8cqw,-2.4cqw);}
.venn .c2 span{transform:translate(1.8cqw,-2.4cqw);}
.venn .c3 span{transform:translateY(3cqw);}
.venn .mid{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:5;
  width:13cqw;text-align:center;font-size:1.6cqw;font-weight:800;color:var(--ink);line-height:1.2;}
.venn .side{flex:1;display:flex;flex-direction:column;gap:1.5cqw;}
.venn .row{display:flex;gap:1.2cqw;align-items:baseline;}
.venn .row .t{font-size:1.62cqw;font-weight:800;color:var(--ink);min-width:9cqw;}
.venn .row .d{font-size:1.65cqw;color:var(--body);line-height:1.35;}
/* the build is four slides, not four timers: the presenter decides when each
   group arrives. A beat says how many are up; the newest one is the only thing
   that animates, so nothing already on screen twitches when the slide changes.
   Hidden rows keep their space (visibility, not display) so the list never jumps. */
.venn .c{opacity:0;}
.venn .c.on{opacity:1;}
.venn .side .row{visibility:hidden;}
.venn .side .row.on{visibility:visible;}
.venn .mid{opacity:0;}
.venn .mid.on{opacity:1;}
.slide.on .venn .c.new,.slide.on .venn .side .row.new{animation:vpop 0.78s cubic-bezier(.2,.8,.3,1) both;}
.slide.on .venn .mid.on{animation:vmid 0.85s cubic-bezier(.2,.8,.3,1) both;}
@keyframes vpop{from{opacity:0;transform:scale(.84);}to{opacity:1;transform:none;}}
/* .mid is centred with a translate, so the keyframes have to carry it */
@keyframes vmid{from{opacity:0;transform:translate(-50%,-50%) scale(.78);}
                to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
@media (prefers-reduced-motion:reduce){
  .slide.on .venn .c.new,.slide.on .venn .side .row.new,.slide.on .venn .mid.on{animation:none;}
}
}

/* cover: the logo mark is portrait (238×468), so it stands beside the name
   rather than above it. Nothing else on the slide. */
/* the wordmark is the point of this slide, so it gets the top third at 9cqw and
   the video takes whatever height is left (flex:1 + object-fit:cover) */
.slide.cover{justify-content:center;text-align:center;}
.cover .row{display:flex;flex-direction:column;align-items:center;gap:1.8cqw;flex:1;min-height:0;}
.cover .txt{flex:none;}
.cover .name{justify-content:center;}
/* the mark sits after the wordmark, at cap height — a signature, not a headline */
.cover .name{display:flex;align-items:center;gap:1.6cqw;
  font-size:9cqw;font-weight:800;letter-spacing:-.04em;line-height:1;}
.cover .name b{color:var(--accent);}
.cover .mark{height:7cqw;width:auto;display:block;}
.cover .line{font-size:2.6cqw;color:var(--body);margin-top:1.8cqw;line-height:1.3;font-weight:600;}
.cover .who{margin-top:1.6cqw;font-size:1.7cqw;font-weight:700;letter-spacing:.04em;color:var(--mute);}
/* the arm actually running a mission — the only moving thing in the deck, and it
   sits on the one slide where nobody is listening to a claim yet. */
.cover .media{flex:1;min-height:0;width:42cqw;border-radius:1.4cqw;overflow:hidden;background:#efe3cd;}
.cover .media video{width:100%;height:100%;object-fit:cover;display:block;}

/* ── ⓐ stats · ⓑ ratio · ⓒ numbered ───────────────────────────────────────────
   These three carry no card box at all. Six of the deck's slides were "different
   layouts" that all rendered the same white rounded rectangle, so the variety was
   in the code and not on the screen. Dropping the box also frees the space that
   makes the numbers bigger. */

/* ⓐ stats — bare figures on the cream, hairline between */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6cqw;height:auto;align-items:start;}
.stats.c2{grid-template-columns:repeat(2,1fr);gap:3.4cqw;}
.stats.c2 .st + .st{padding-left:3.4cqw;}
.stats.c2 .n{font-size:7cqw;}
.stats.c2 .d{font-size:1.8cqw;}
.stats .st + .st{border-left:1px solid var(--line);padding-left:2.6cqw;}
.stats .n{font-size:5.6cqw;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink);}
.stats .st.focus .n{color:var(--accent);}
.stats .k{margin-top:1.2cqw;font-size:1.48cqw;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);}
.stats .d{margin-top:.7cqw;font-size:1.65cqw;line-height:1.38;color:var(--body);}

/* ⓑ ratio — a proportion reads faster as a ring than as digits */
.ratio{display:flex;align-items:center;gap:4.5cqw;height:100%;}
.ring{position:relative;width:21cqw;height:21cqw;flex:none;border-radius:50%;
  display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0);}
.ring::after{content:'';position:absolute;inset:3cqw;border-radius:50%;background:var(--page);}
.ring span{position:relative;z-index:1;font-size:4.6cqw;font-weight:800;
  letter-spacing:-.04em;color:var(--ink);}
.ratio .side{flex:1;}
/* a flock of small factories, thirteen of twenty lit. The share arrives as a
   quantity before the number beside it is read as a number. */
.pgrid{flex:0 0 26cqw;display:grid;grid-template-columns:repeat(5,1fr);gap:.8cqw;}
.pgrid svg{width:100%;height:auto;display:block;color:#ddd0b4;}
.pgrid svg.lit{color:var(--accent);}
.slide.on .pgrid svg.lit{animation:litup 0.62s ease both;animation-delay:calc(var(--i) * 0.07s + 0.23s);}
@keyframes litup{from{color:#ddd0b4;transform:scale(.9)} to{color:var(--accent);transform:none}}
.people li i{font-style:normal;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  font-size:.8em;color:var(--mute);}
.pnum{font-size:5.2cqw;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent);
  margin-bottom:.5cqw;}
.ratio .unit{font-size:2.05cqw;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:1.3cqw;}
.ratio ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8cqw;}
.ratio li{position:relative;padding-left:1.8cqw;font-size:1.75cqw;line-height:1.35;color:var(--body);}
.ratio li::before{content:'';position:absolute;left:0;top:.75cqw;width:.5cqw;height:.5cqw;
  border-radius:50%;background:var(--dot);}

/* ⓒ numbered — a sequence without arrows or boxes */
.num{display:flex;flex-direction:column;height:auto;}
.num .row{display:flex;align-items:flex-start;gap:2.2cqw;padding:1.1cqw 0;
  border-bottom:1px solid var(--line);}
.num .row:last-child{border-bottom:none;}
.num .i{font-size:3.2cqw;font-weight:800;letter-spacing:-.03em;color:var(--line);min-width:5cqw;}
.num .row.focus .i{color:var(--accent);}
.num .t{font-size:2.4cqw;font-weight:800;color:var(--ink);min-width:14cqw;}
.num .col{flex:1;}
.num .d{font-size:1.68cqw;line-height:1.35;color:var(--body);}

/* bare timeline — the axis without the cards hanging off it */
.tlb{position:relative;padding-top:3.6cqw;display:flex;gap:2.6cqw;height:100%;}
.tlb::before{content:'';position:absolute;left:5%;right:5%;top:1.6cqw;height:2px;background:var(--line);}
.tlb .mk{flex:1;position:relative;display:flex;flex-direction:column;gap:.75cqw;}
.tlb .tdot{position:absolute;top:1.6cqw;transform:translate(-50%,-50%);
  width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 .45cqw var(--page);left:var(--to);}
.slide.on .tlb .tdot{animation:travel 1.63s cubic-bezier(.3,.8,.3,1) both;animation-delay:0.39s;}
@keyframes travel{from{left:5%;} to{left:var(--to);}}
@media (prefers-reduced-motion:reduce){ .slide.on .tlb .tdot{animation:none;} }
.tlb .when{font-size:1.5cqw;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
.tlb .mk.on .when{color:var(--accent);}
.tlb .what{font-size:2.35cqw;font-weight:800;color:var(--ink);line-height:1.1;min-height:5.2cqw;}
.tlb .mk .bl li b{color:var(--accent);}
.tlb .d{font-size:1.65cqw;line-height:1.35;color:var(--body);}

/* one bullet style shared by every layout that is not a card. Prose in a slide
   makes the room read instead of listen; a noun-phrase bullet is scanned. */
.bl{list-style:none;margin:.7cqw 0 0;padding:0;display:flex;flex-direction:column;gap:.6cqw;}
.bl li{position:relative;padding-left:1.5cqw;line-height:1.32;color:var(--body);}
.bl li::before{content:'';position:absolute;left:0;top:.62cqw;width:.45cqw;height:.45cqw;
  border-radius:50%;background:var(--dot);}
.stats .bl li{font-size:1.6cqw;}
.tlb .bl li{font-size:1.6cqw;}
.num .bl li{font-size:1.6cqw;}
.venn .bl li{font-size:1.58cqw;}
.venn .bl{margin-top:0;}

/* ── entrance motion ──────────────────────────────────────────────────────────
   Only on the four slides whose ARGUMENT is a change: a proportion filling, a
   record accumulating, a market narrowing, revenue growing. Everywhere else the
   slide is a statement, and a statement should not move.
   No video, no assets — the shape animates itself. Slides are display:none until
   active, so the animation restarts every time the slide is shown. */
@property --fill{syntax:'<number>';initial-value:0;inherits:false;}

/* ⓑ the 65% ring fills */
.ring{--fill:var(--p);
  background:conic-gradient(var(--accent) calc(var(--fill) * 1%), var(--line) 0);}
@keyframes ringfill{from{--fill:0} to{--fill:var(--p)}}
.slide.on .ring{animation:ringfill 1.4s cubic-bezier(.2,.8,.3,1) 0.16s both;}

/* ⓔ bars grow out of the baseline, one after another */
@keyframes bargrow{from{height:0} to{height:var(--h)}}
.slide.on .bars .bar{animation:bargrow 1.08s cubic-bezier(.2,.8,.3,1) both;
  animation-delay:calc(var(--i) * 0.14s + 0.16s);}

/* ⓕ the funnel is built, not shrunk. Bars grow from nothing to their own width,
   one after the other — TAM, then SAM, then SOM — so the room watches the
   arithmetic being laid down rather than a full bar being cut back. The stagger
   is longer than the others (.34s against a .62s bar) because "then" is the
   point: three bars arriving together would read as three facts, not a sum. */
@keyframes grow{from{width:0} to{width:var(--w)}}
.slide.on .fun .tier{animation:grow 0.96s cubic-bezier(.2,.8,.3,1) both;
  animation-delay:calc(var(--i) * 0.53s + 0.16s);}

@media (prefers-reduced-motion:reduce){
  .slide.on .ring,.slide.on .bars .bar,.slide.on .fun .tier{animation:none;}
}

/* outro — the longest-lived screen in the talk: it stays up through Q&A. So it
   mirrors the cover (the same sentence, read a second time with 34 slides of
   evidence behind it) and carries the QR, because slide 12 claims the course is
   live and a judge should be able to check that from their seat. */
.slide.outro{justify-content:center;text-align:center;}
.outro .name{display:flex;align-items:center;justify-content:center;gap:1.6cqw;
  font-size:8cqw;font-weight:800;letter-spacing:-.04em;line-height:1;}
.outro .name b{color:#e0442e;}
.outro .mark{height:6.2cqw;width:auto;display:block;}
.outro .line{font-size:2.4cqw;color:var(--body);margin-top:1.8cqw;font-weight:600;}
.outro .rule{width:56cqw;height:1px;background:var(--line);margin:2.6cqw auto;}
/* the address stands above the pair, so it belongs to both the code and the card
   rather than sitting inside one of them */
/* a source inside a card: there so the claim is checkable, quiet so it does not
   compete with the claim itself */
.cite{font-weight:600;color:var(--mute);white-space:nowrap;}
.outro .siteurl{font-size:2.4cqw;font-weight:800;letter-spacing:-.02em;color:var(--ink);
  margin-bottom:1.4cqw;}
.outro .row{display:flex;align-items:center;justify-content:center;gap:2.6cqw;}
.outro .qr{width:14cqw;height:14cqw;display:block;}
.outro .contact{text-align:left;font-size:1.8cqw;line-height:1.55;color:var(--body);}
.outro .contact b{display:block;color:var(--ink);font-weight:700;}
/* the QR is the only thing in the deck a judge can check while sitting there, so
   it says what is behind it. "Live now" is the claim; the counts make it checkable. */
/* The QR is the only claim a judge can check from their seat, so what sits beside
   it is not a contact line — it is the inventory of what is already built. Read at
   the back of the room, which is why it is a card and not a caption. */
.outro .livecard{text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-top:.35cqw solid var(--accent);border-radius:1.1cqw;padding:1.5cqw 2.2cqw 1.3cqw;
  box-shadow:0 1.2cqw 2.6cqw rgba(120,80,20,.18);}
.outro .livecard .lk{font-size:1.5cqw;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:.7cqw;}
.outro .livecard .lb{font-size:2.1cqw;line-height:1.35;color:var(--ink);font-weight:600;}
.outro .livecard .lb b{display:inline;font-weight:800;color:var(--accent);}
.outro .livecard .lu{margin-top:1cqw;padding-top:.8cqw;border-top:1px solid var(--line);
  font-size:1.5cqw;color:var(--mute);font-weight:700;}
.outro .thanks{font-size:2cqw;font-weight:700;color:var(--mute);margin-top:2.6cqw;}

/* bridge connectors — an arrow glyph says "next"; a rail with something moving
   along it says "these two are joined and traffic runs both ways". The dots
   travel toward the centre from both sides, which is the whole claim. */
/* ⓘ pays — the money, read the way English reads: who pays, what for, how
   much. The amount was the first thing on screen before, which is the last
   thing a reader can use. A coin travels the arrow so the direction is felt. */
.pays{display:flex;flex-direction:column;gap:2.1cqw;}
.pline{display:grid;grid-template-columns:20cqw 1fr 18cqw;gap:2cqw;align-items:center;}
.pays .who{background:var(--card);border:1.5px solid var(--line);border-radius:1cqw;
  padding:1.45cqw 1.7cqw;font-size:2.4cqw;font-weight:800;letter-spacing:-.02em;color:var(--ink);
  display:flex;align-items:center;white-space:nowrap;}
.pays .mid{display:flex;flex-direction:column;align-items:center;gap:.5cqw;}
.pays .for{font-size:1.9cqw;font-weight:700;color:var(--body);text-align:center;line-height:1.25;}
.pays .arrow{position:relative;width:100%;height:.22cqw;background:var(--line);border-radius:99px;}
.pays .arrow::after{content:'';position:absolute;right:-.15cqw;top:50%;
  border:.55cqw solid transparent;border-left-color:var(--line);transform:translateY(-50%);}
.pays .arrow i{position:absolute;top:50%;width:.9cqw;height:.9cqw;border-radius:50%;
  background:var(--accent);transform:translate(-50%,-50%);}
.slide.on .pays .arrow i{animation:coin 5.27s cubic-bezier(.4,0,.2,1) infinite;}
.slide.on .pline:nth-child(2) .arrow i{animation-delay:2.63s;}
@keyframes coin{0%{left:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:100%;opacity:0}}
.pays .amt{background:var(--accent);border-radius:1cqw;padding:1.2cqw 1.4cqw;text-align:center;
  box-shadow:0 1.2cqw 2.6cqw rgba(120,80,20,.22);}
.pays .amt b{display:block;font-size:3.7cqw;font-weight:800;letter-spacing:-.03em;
  line-height:1;color:#fff;}
.pays .amt span{display:block;margin-top:.35cqw;font-size:1.43cqw;font-weight:700;
  color:rgba(255,255,255,.85);}
/* each row carries its own evidence, so no line has to be taken on trust */
.pays .ev{grid-column:1 / -1;margin-top:.75cqw;font-size:1.65cqw;color:var(--body);
  padding-left:.2cqw;}
.pays .ev b{color:var(--accent);font-weight:800;}
@media (prefers-reduced-motion:reduce){ .slide.on .pays .arrow i{display:none;} }

/* ⓗ screen — a product screen, drawn rather than screenshotted: sharp on a
   projector, in the deck's own palette, and a wording change is one line.
   Everything is scoped under .scw so the short class names cannot collide. */
.scw{display:grid;grid-template-columns:1fr 27cqw;gap:2.4cqw;align-items:start;}
.scw .win{background:var(--card);border:1.5px solid var(--line);border-radius:1.1cqw;
  overflow:hidden;box-shadow:0 1.4cqw 3cqw rgba(120,80,20,.14);}
.scw .wbar{display:flex;align-items:center;gap:.6cqw;padding:.85cqw 1.2cqw;background:#f6efe0;
  border-bottom:1px solid var(--line);}
.scw .wbar i{width:.7cqw;height:.7cqw;border-radius:50%;background:var(--dot);display:block;}
.scw .url{margin-left:.8cqw;flex:1;background:#fff;border:1px solid var(--line);border-radius:99px;
  padding:.3cqw 1cqw;font-size:1.38cqw;color:var(--mute);}
.scw .scr{padding:1.15cqw 1.5cqw;}
/* the product does not exist yet; the slide says so rather than letting a
   judge discover it in Q&A */
.scw .note{margin-top:.7cqw;font-size:1.4cqw;color:var(--mute);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;}
.scw .sp .k{font-size:1.45cqw;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
.scw .sp .big{font-size:3.2cqw;font-weight:800;letter-spacing:-.03em;line-height:1.04;
  margin-top:.4cqw;color:var(--ink);}
.scw .sp ul{list-style:none;margin:1.2cqw 0 0;padding:0;display:flex;flex-direction:column;gap:.8cqw;}
.scw .sp li{position:relative;padding-left:1.7cqw;font-size:1.7cqw;line-height:1.3;color:var(--body);}
.scw .sp li::before{content:'';position:absolute;left:0;top:.75cqw;width:.55cqw;height:.55cqw;
  border-radius:50%;background:var(--dot);}
/* screen 1 — the task */
.scw .spon{font-size:1.4cqw;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);}
.scw .spon b{color:var(--accent);}
.scw .tt{font-size:2.35cqw;font-weight:800;letter-spacing:-.025em;line-height:1.12;margin-top:.7cqw;}
.scw .chips{display:flex;gap:.6cqw;margin-top:.85cqw;flex-wrap:wrap;}
.scw .chip{font-size:1.43cqw;font-weight:700;padding:.35cqw .9cqw;border-radius:99px;
  background:#f1ebdc;color:var(--body);}
.scw .crit{margin-top:1cqw;border-top:1px solid var(--line);}
.scw .crit .cr{display:flex;justify-content:space-between;gap:1.4cqw;padding:.5cqw 0;
  font-size:1.53cqw;color:var(--body);border-bottom:1px solid var(--line);}
.scw .crit .cr b{color:var(--ink);font-weight:700;white-space:nowrap;}
.scw .cta{margin-top:1cqw;display:inline-block;background:var(--accent);color:#fff;
  font-weight:800;font-size:1.5cqw;padding:.65cqw 1.4cqw;border-radius:.7cqw;}
/* screen 2 — the public board */
.scw .bh{display:flex;align-items:baseline;justify-content:space-between;gap:1.4cqw;}
.scw .bh .t{font-size:1.9cqw;font-weight:800;letter-spacing:-.02em;}
.scw .bh .d{font-size:1.48cqw;font-weight:800;color:var(--accent);letter-spacing:.08em;}
.scw .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.8cqw;margin-top:1cqw;}
.scw .tile{border:1px solid var(--line);border-radius:.7cqw;overflow:hidden;background:#fdfbf6;}
.scw .thumb{aspect-ratio:16/9;position:relative;
  background:linear-gradient(135deg,#e9e0cc 0 40%,#dfd4bb 40% 100%);}
.scw .thumb::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border:.5cqw solid transparent;border-left-color:#fff;border-left-width:.9cqw;}
.scw .tile .m{padding:.5cqw .6cqw;}
.scw .tile .who{font-size:1.38cqw;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scw .pr{height:.28cqw;background:var(--line);border-radius:99px;margin-top:.35cqw;}
.scw .pr i{display:block;height:100%;background:var(--accent);border-radius:99px;}
/* screen 3 — the ranked list */
.scw .lst{margin-top:1cqw;}
.scw .lst .lr{display:grid;grid-template-columns:2.6cqw 1fr 6cqw 7cqw;gap:1cqw;align-items:center;
  padding:.52cqw 0;border-bottom:1px solid var(--line);font-size:1.55cqw;}
.scw .lst .lr.top{background:color-mix(in srgb,var(--accent) 12%,#fff);margin:0 -1cqw;
  padding-left:1cqw;padding-right:1cqw;border-radius:.5cqw;}
.scw .lst .rk{font-weight:800;color:var(--mute);}
.scw .lst .lr.top .rk{color:var(--accent);}
.scw .lst .who{font-weight:700;}
.scw .lst .sc{font-weight:800;text-align:right;}
.scw .lst .bt{font-size:1.4cqw;font-weight:800;text-align:center;padding:.28cqw .5cqw;
  border-radius:.4cqw;border:1px solid var(--line);color:var(--mute);}
.scw .lst .lr.top .bt{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ⓖ migrate — one journey per row: where hiring came from, where it went.
   Row two runs the same road and arrives at a dashed box, because for robots
   nobody has built the destination. The dot moving left to right says
   "already in motion" before a word is read. */
.mig{display:flex;flex-direction:column;gap:2.3cqw;}
.mrow{display:grid;grid-template-columns:17cqw 1fr 8cqw 1fr;gap:1.6cqw;align-items:center;}
.mig .mk2{font-size:1.85cqw;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink);line-height:1.25;}
.mig .box{background:var(--card);border:1.5px solid var(--line);border-radius:1cqw;
  padding:1.7cqw 1.9cqw;font-size:2.3cqw;font-weight:800;letter-spacing:-.02em;
  color:var(--ink);line-height:1.15;}
.mig .box.from{color:var(--mute);}
.mig .box.to{background:var(--accent);border-color:var(--accent);color:#fff;}
/* the one destination that does not exist: outline only, and it breathes */
.mig .box.to.empty{background:none;border-style:dashed;border-width:.28cqw;
  border-color:var(--accent);color:var(--accent);}
.mig .track{position:relative;height:.22cqw;background:var(--line);border-radius:99px;}
.mig .track::after{content:'';position:absolute;right:-.15cqw;top:50%;
  border:.55cqw solid transparent;border-left-color:var(--line);transform:translateY(-50%);}
.mig .track i{position:absolute;top:50%;width:.85cqw;height:.85cqw;border-radius:50%;
  background:var(--accent);transform:translate(-50%,-50%);}
.slide.on .mig .track i{animation:runacross 3.41s cubic-bezier(.4,0,.2,1) infinite;}
@keyframes runacross{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:100%;opacity:0}}
.slide.on .mig .box.to{animation:arrive 0.85s cubic-bezier(.2,.8,.3,1) 0.39s both;}
@keyframes arrive{from{opacity:0;transform:translateX(-1.6cqw) scale(.96)}to{opacity:1;transform:none}}
.slide.on .mig .box.to.empty{animation:arrive 0.85s cubic-bezier(.2,.8,.3,1) 0.39s both,
  breathe 3.4s ease-in-out 1.24s infinite;}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){
  .slide.on .mig .track i{display:none;}
  .slide.on .mig .box.to,.slide.on .mig .box.to.empty{animation:none;}
}

/* ⓕ cmt — a competitor table, because that is the one shape a room reads as
   "competition" without being told. One row per company, one column per
   question, and a last column that is crosses all the way down until our row. */
.cmt{display:flex;flex-direction:column;gap:.55cqw;}
.cmt .r{display:grid;grid-template-columns:20cqw 1fr 1fr 8cqw;gap:1.8cqw;align-items:center;
  padding:1cqw 1.7cqw;border-radius:.9cqw;background:var(--card);border:1.5px solid var(--line);}
.cmt .r.head{background:none;border-color:transparent;padding:0 1.8cqw .3cqw;}
.cmt .r.head span{font-size:1.43cqw;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);}
.cmt .r.head span:last-child{text-align:center;}
.cmt .who{font-size:1.9cqw;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
.cmt .c{font-size:1.65cqw;color:var(--body);line-height:1.25;}
/* the last column is the argument, not decoration: a red cross on every company
   that stops at software, one green tick on ours. On the filled row the same
   green is lifted to a mint, because #0e9a89 on the accent fill reads as sludge. */
.cmt .m{font-size:2.5cqw;font-weight:800;text-align:center;color:var(--mute);}
.cmt .m.no{color:#e0442e;}
.cmt .m.ok{color:#0e9a89;}
.cmt .r.us{background:var(--accent);border-color:var(--accent);
  box-shadow:0 1.2cqw 2.6cqw rgba(120,80,20,.24);}
.cmt .r.us .who,.cmt .r.us .c{color:#fff;}
.cmt .r.us .m{color:#7cf0d5;font-size:2.9cqw;}
/* the mark rides in front of the name wherever the brand is written, so the room
   ties the shape to the words instead of learning the two separately. Sized in em
   so one class serves a table row, a flow box and a label. On the filled row it is
   knocked out to white, the same trick the bridge slide uses. */
/* the payer marks. An emoji or an image path — so dropping the official
   government mark into assets/brand/ and changing one string is the whole swap,
   with no renderer change. Slightly larger than the name it precedes, because a
   symbol is recognised at a size where a word would still be being read. */
.pays .pmk{font-size:1.25em;margin-right:.4em;line-height:1;}
.pays .pmk img{height:1.15em;width:auto;display:inline-block;vertical-align:-.16em;}
.bmk{height:1.05em;width:auto;display:inline-block;vertical-align:-.15em;margin-right:.34em;}
.cmt .r.us .bmk{filter:brightness(0) invert(1);}

/* ⓔ stack — an escalation. Two bands; the second is stepped in and filled, so
   the shape itself says "and then it gets worse" before a word is read. */
.stk{display:flex;flex-direction:column;gap:1.6cqw;}
.stk .band{display:grid;grid-template-columns:24cqw 1fr;gap:2.6cqw;align-items:center;
  background:var(--card);border:1.5px solid var(--line);border-radius:1.1cqw;padding:1.9cqw 2.1cqw;}
.stk .band + .band{margin-left:5cqw;}
.stk .bk{font-size:1.85cqw;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);}
.stk .bb{font-size:3.4cqw;font-weight:800;letter-spacing:-.03em;line-height:1.02;margin-top:.35cqw;color:var(--ink);}
.stk .band ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.7cqw;}
.stk .band li{position:relative;padding-left:1.8cqw;font-size:1.8cqw;line-height:1.3;color:var(--body);}
.stk .band li::before{content:'';position:absolute;left:0;top:.8cqw;width:.55cqw;height:.55cqw;
  border-radius:50%;background:var(--dot);}
.stk .band.focus{background:var(--accent);border-color:var(--accent);
  box-shadow:0 1.4cqw 3cqw rgba(120,80,20,.24);}
.stk .band.focus .bk{color:rgba(255,255,255,.85);}
.stk .band.focus .bb,.stk .band.focus li{color:#fff;}
.stk .band.focus li::before{background:rgba(255,255,255,.8);}

/* ── 01: two customers, and the brand as the arrow that crosses to each ─────
   Physical Spark is not a third card with its own bullets. It is what turns the
   pain above the line into the answer below it, so it is drawn as a mark with
   arrows leaving it — nothing to read, only a direction. */
.slide.lay-bridge h1{font-size:4.6cqw;margin-top:1cqw;}
.slide.lay-people h1{font-size:4.4cqw;}
.slide.lay-venn .body{margin-top:3.4cqw;}
.slide.lay-stats h1{font-size:4.1cqw;}
.slide.lay-bignum .sub{font-size:2.6cqw;font-weight:700;color:var(--ink);
  letter-spacing:-.015em;max-width:74cqw;}
.globe{position:absolute;right:6cqw;top:7cqw;width:15cqw;height:auto;
  fill:none;stroke:var(--accent);stroke-width:1.6;opacity:.5;}
.globe circle,.globe ellipse,.globe line,.globe path{vector-effect:non-scaling-stroke;}
.slide.lay-bridge .body,.slide.lay-funnel .body{margin-top:2.4cqw;display:flex;flex-direction:column;}
.flow.bridge{gap:1.4cqw;height:auto;}
.flow.bridge .card{padding:1.4cqw 1.6cqw;}
.bridge .nrow{flex:none;display:flex;align-items:center;gap:1cqw;min-height:6.1cqw;}
.bridge .bname{font-size:2.9cqw;font-weight:800;letter-spacing:-.03em;line-height:1.05;
  flex:1;color:var(--ink);}
/* a <use> shadow tree ignores selector-based rules, but inherits `color` — so
   the marks are painted from the wrapper and follow the chapter accent for free */
.bridge .mk{flex:none;width:5cqw;aspect-ratio:1;border-radius:50%;display:grid;
  place-items:center;background:#f6efe0;border:1.5px solid var(--line);color:var(--accent);}
.bridge .mk svg{width:66%;height:auto;display:block;}
.bridge .lbl{font-size:1.48cqw;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);margin-top:1cqw;}
.bridge .lbl.give{color:var(--accent);}
.bridge .card ul{margin:.6cqw 0 0;gap:.6cqw;}
.bridge .card li{font-size:1.8cqw;line-height:1.3;padding-left:1.9cqw;}
.bridge .card li::before{top:.78cqw;width:.55cqw;height:.55cqw;}
.bridge .hair{flex:none;height:1px;background:var(--line);margin-top:1cqw;}
.bridge .mid{flex:0 0 16cqw;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.7cqw;}
.bridge .plogo{width:5.6cqw;aspect-ratio:1;border-radius:50%;background:var(--accent);
  display:grid;place-items:center;box-shadow:0 1cqw 2.4cqw rgba(224,68,46,.30);}
.bridge .plogo img{height:3.7cqw;width:auto;display:block;filter:brightness(0) invert(1);}
.bridge .mid .nm{font-size:2.9cqw;font-weight:800;letter-spacing:-.03em;color:var(--ink);
  text-align:center;line-height:1.06;}
/* the connector is a little bridge, not an arrow: a deck on piers with two
   loads crossing it, so the drawing says what the slide says */
.bridge .bspan{width:100%;height:auto;display:block;overflow:visible;}
.bridge .bdeck{stroke:#c3b294;stroke-width:2.2;stroke-linecap:round;}
.bridge .bsill{stroke:#d6c9ae;stroke-width:1.4;stroke-linecap:round;}
.bridge .bpier{stroke:#d6c9ae;stroke-width:1.4;stroke-linecap:round;}
/* the middle card used to carry the revenue; with it gone the money moves here */
.payline{margin-top:1.4cqw;font-size:1.6cqw;font-weight:700;color:var(--body);}
.payline b{color:var(--accent);font-weight:800;}
.slide.tight .card li{font-size:1.6cqw;line-height:1.3;}
.slide.tight .card ul{gap:.55cqw;}
.flow.bridge .link svg{width:100%;height:auto;display:block;overflow:visible;}
.flow.bridge .rail{stroke:var(--dot);stroke-width:3;stroke-linecap:round;}
.flow.bridge .pier{stroke:var(--line);stroke-width:2.5;stroke-linecap:round;}
.flow.bridge .pip{fill:var(--accent);}
@media (prefers-reduced-motion:reduce){ .flow.bridge .pip{display:none;} }

/* chapter divider: name only, six seconds, a place to breathe */
.slide.divider{justify-content:center;}
.slide.divider h1{font-size:7.8cqw;color:var(--accent);}
.slide.divider .sub{font-size:2cqw;max-width:60cqw;margin-top:1.6cqw;}

/* footer */
.foot{position:absolute;left:6cqw;right:6cqw;bottom:3.6cqw;display:flex;
  align-items:center;justify-content:space-between;gap:2cqw;}
.foot .src,.foot .pg{font-size:1.35cqw;color:var(--mute);}
.foot .pg{font-weight:700;}

/* the script, for rehearsal. S folds it away for the real room. */
.pr{position:fixed;left:0;right:0;bottom:52px;z-index:35;background:#241d16;color:#fff;
  border-top:3px solid var(--accent);padding:10px 20px 12px;display:none;}
.pr.on{display:block;}
.pr .tag{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:#a2917a;display:flex;gap:12px;align-items:center;}
.pr .wc{margin-left:auto;}
.pr .wc.over{color:#ff6a52;}
.pr .say{font-size:19px;line-height:1.5;margin-top:5px;max-width:1150px;}

/* controls */
.ctl{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--page);border-top:1px solid var(--line);}
.ctl-in{display:flex;align-items:center;gap:8px;padding:9px 18px;}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;
  font-size:13px;font-weight:700;cursor:pointer;color:var(--body);}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff;}
.hint{margin-left:auto;font-size:11px;color:var(--mute);}
</style>

   also ten minutes of being shown the shape. One constant, so the lockup cannot
   drift apart between a table row and a flow box. */

/* The solution is one chain walked in three steps, so the chain stays on the wall
   the whole way. The divider shows it empty — three boxes and two arrows, the

   -1 = all empty, 0..2 = that step is live, 3 = the chain is complete. */
const SOL = [['01','The task'],['02','The season'],['03','The output']];
function srail(cur, seed){
  return `<div class="srail">` + SOL.map((st,i)=>{
    const cls = cur<0 ? 'seed' : (i<cur ? 'done' : i===cur ? 'now' : 'todo');
    return `<div class="sbox ${cls}"><b>${st[0]}</b><span>${seed?seed[i]:st[1]}</span></div>` +
           (i<SOL.length-1 ? `<i class="sar">&rarr;</i>` : '');
  }).join('') + `</div>`;
}

/* Chapters own the colour. Open/Problem/Business share red, Why-we-win/Team share
   gold: v1 uses colour as temperature, not as a unique label per section. */
const CHAPTERS = [
  { name:'Open',        c:'#e0442e', from:0,  upto:1  },

/* Cards for the three slides that are walked through one step at a time. Defined
   once; the three beats below point at the same array with a different `focus`,

/* ── render ───────────────────────────────────────────────────────────────── */
const stage=document.getElementById('stage');
const esc = s => s||'';
const blist = v => `<ul class="bl">${(v||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`;
const bullets = v => `<ul>${(v||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`;
const cardEl = (c,on,cls='') =>
  `<div class="card ${on?'focus':''} ${cls}">
     ${c.flag?`<div class="flag">${c.flag}</div>`:''}
     <div class="k">${c.k}</div>${c.big?`<div class="big">${c.big}</div>`:''}${bullets(c.v)}
   </div>`;

/* one span of the bridge: a deck on piers, with two loads crossing it. dir -1
   heads left to the developers, dir 1 heads right to the factories — traffic
   leaves us in both directions, which is what a two-sided market looks like. */
function brSpan(){
  return `<svg class="bspan" viewBox="0 0 100 26" aria-hidden="true">
      <line class="bpier" x1="8"  y1="9" x2="8"  y2="21"/>
      <line class="bpier" x1="29" y1="9" x2="29" y2="21"/>
      <line class="bpier" x1="50" y1="9" x2="50" y2="21"/>
      <line class="bpier" x1="71" y1="9" x2="71" y2="21"/>
      <line class="bpier" x1="92" y1="9" x2="92" y2="21"/>
      <line class="bsill" x1="4" y1="21" x2="96" y2="21"/>
      <line class="bdeck" x1="2" y1="9" x2="98" y2="9"/>
    </svg>`;
}

/* a globe beside the headline on the closing slides — line art, in the chapter
   accent, so "goes global" has something to look at without a photo */
const GLOBE = `<svg class="globe" viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="50" r="42"/>
  <ellipse cx="50" cy="50" rx="42" ry="16"/>
  <ellipse cx="50" cy="50" rx="17" ry="42"/>
  <line x1="8" y1="50" x2="92" y2="50"/>
  <path d="M17,26 A 58 58 0 0 0 83,26 M17,74 A 58 58 0 0 1 83,74"/>
</svg>`;

function bodyHTML(b){
  const f = b.focus;
  switch(b.layout){
    case 'cards':
      return `<div class="cards ${b.cols||'c3'}">` +
        b.cards.map((c,i)=>cardEl(c,i===f,i===b.ghost?'ghost':'')).join('') + `</div>`;
    case 'compare':
      return `<div class="cmp">${cardEl(b.cards[0],f===0)}
        <span class="vs">VS</span>${cardEl(b.cards[1],f===1)}</div>`;
    case 'pays':
      return `<div class="pays">` + b.lines.map(l=>`
        <div class="pline">
          <div class="who">${l.mk?`<span class="pmk">${/^assets\//.test(l.mk)?`<img src="${l.mk}" alt="">`:l.mk}</span>`:''}${l.who}</div>
          <div class="mid"><div class="for">${l.for}</div><div class="arrow"><i></i></div></div>
          <div class="amt"><b>${l.amt}</b><span>${l.unit}</span></div>
          <div class="ev">${l.ev}</div>
        </div>`).join('') + `</div>`;
    case 'screen': {
      const d=b.scr, inner =
        d.kind==='task' ? `<div class="spon">Sponsored by <b>${d.sponsor}</b> &nbsp;&middot;&nbsp; ${d.roles}</div>
            <div class="tt">${d.title}</div>
            <div class="chips">${d.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
            <div class="crit">${d.crit.map(r=>`<div class="cr"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
            <span class="cta">${d.cta}</span>`
      : d.kind==='board' ? `<div class="bh"><span class="t">${d.t}</span><span class="d">${d.d}</span></div>
            <div class="tiles">${d.tiles.map(t=>`<div class="tile"><div class="thumb"></div>
              <div class="m"><div class="who">${t[0]}</div><div class="pr"><i style="width:${t[1]}%"></i></div></div></div>`).join('')}</div>`
      : `<div class="bh"><span class="t">${d.t}</span><span class="d">${d.d}</span></div>
            <div class="lst">${d.rows.map(r=>`<div class="lr ${r[4]?'top':''}"><span class="rk">${r[0]}</span>
              <span class="who">${r[1]}</span><span class="sc">${r[2]}</span><span class="bt">${r[3]}</span></div>`).join('')}</div>`;
      return `<div class="scw">
        <div><div class="win"><div class="wbar"><i></i><i></i><i></i><span class="url">${d.url}</span></div>
          <div class="scr">${inner}</div></div>
          <div class="note">Design mockup &nbsp;&middot;&nbsp; season one, building now</div></div>
        <div class="sp"><div class="k">${b.step}</div><div class="big">${b.big}</div>${bullets(b.v)}</div>
      </div>`;
    }
    case 'migrate':
      return `<div class="mig">` + b.rows.map(r=>`
        <div class="mrow">
          <span class="mk2">${r.k}</span>
          <div class="box from">${r.from}</div>
          <span class="track"><i></i></span>
          <div class="box to ${r.empty?'empty':''}">${r.to}</div>
        </div>`).join('') + `</div>`;
    case 'table':
      return `<div class="cmt">
        <div class="r head">${b.cols.map(c=>`<span>${c}</span>`).join('')}</div>` +
        b.rows.map(r=>`<div class="r ${r.us?'us':''}">
          <div class="who">${r.n}</div><div class="c">${r.who}</div>
          <div class="c">${r.how}</div>
          <div class="m ${r.robot?'ok':'no'}">${r.robot?'&#10003;':'&#10007;'}</div>
        </div>`).join('') + `</div>`;
    case 'stack':
      return `<div class="stk">` + b.bands.map((x,i)=>`
        <div class="band ${i===b.focus?'focus':''}">
          <div><div class="bk">${x.k}</div><div class="bb">${x.big}</div></div>
          <div>${bullets(x.v)}</div>
        </div>`).join('') + `</div>`;
    case 'bridge': {
      const bc = c => `<div class="card">
        <div class="nrow"><div class="bname">${c.name}</div>
          <span class="mk"><svg><use href="#${c.mk}"/></svg></span></div>
        <div class="lbl">The pain</div>${bullets(c.pain)}
        <div class="hair"></div>
        <div class="lbl give">${MK}Physical Spark gives</div>${bullets(c.give)}</div>`;
      return `<div class="flow bridge">${bc(b.cards[0])}
        <div class="mid">
          ${brSpan()}
          <span class="plogo"><img src="assets/logo-mark.png" alt=""></span>
          <div class="nm">Physical<br>Spark</div>
          ${brSpan()}
        </div>${bc(b.cards[1])}</div>
        <div class="payline">${b.pay}</div>`;
    }
    case 'flow':
      return `<div class="flow">` +
        b.cards.map((c,i)=>cardEl(c,i===f)).join('<span class="arw">&rarr;</span>') + `</div>`;
    case 'timeline':
      return `<div class="tl">` + b.cards.map((c,i)=>
        `<div class="mk ${i===f?'on':''}">${cardEl(c,i===f)}</div>`).join('') + `</div>`;
    case 'bars':
      return `<div class="bars">` + b.bars.map((x,i)=>
        `<div class="col ${i===f?'focus':''}">
           <div class="plot">
             ${x.big?`<div class="val">${x.big}</div>`:''}
             <div class="bar" style="--h:${x.h}%;--i:${i}"></div>
           </div>
           <div class="under"><div class="k">${x.k}</div><div class="cap">${x.cap}</div></div>
         </div>`).join('') + `</div>`;
    case 'funnel':
      return `<div class="fun">` + b.tiers.map((t,i)=>
        `<div class="row ${i===f?'focus':''}">
           <span class="k">${t.k}</span>
           <div class="col">
             <div class="tier ${i===f?'focus':''}" style="--w:${t.w}%;--i:${i}">
               <span class="big">${t.big}</span>
             </div>
             <div class="cap">${t.cap}</div>
           </div>
         </div>`).join('') + `</div>` + (b.pay?`<div class="payline">${b.pay}</div>`:'');
    case 'stats':
      return `<div class="stats ${b.stats.length===2?'c2':''}">` + b.stats.map((x,i)=>
        `<div class="st ${i===f?'focus':''}">
           <div class="n">${x.n}</div><div class="k">${x.k}</div>${blist(x.v)}
         </div>`).join('') + `</div>`;
    case 'ratio': {
      /* twenty factories, thirteen of them filled. The share is legible as a
         quantity before the number underneath it is read as a number. */
      const N=20, lit=Math.round(b.p/100*N);
      return `<div class="ratio">
        <div class="pgrid">${Array.from({length:N},(_,i)=>
          `<svg class="${i<lit?'lit':''}" viewBox="0 0 64 64" aria-hidden="true"
                style="--i:${i}"><use href="#i-fac"></use></svg>`).join('')}</div>
        <div class="side"><div class="pnum">${b.num}</div>
          <div class="unit">${b.unit}</div>${bullets(b.list)}</div></div>`;
    }
    case 'numbered':
      return `<div class="num">` + b.rows.map((x,i)=>
        `<div class="row ${i===f?'focus':''}">
           <span class="i mono">${x.i}</span><span class="t">${x.t}</span><div class="col">${blist(x.v)}</div>
         </div>`).join('') + `</div>`;
    case 'tlbare':
      { const to = (5 + (f + .5) / b.marks.length * 90).toFixed(1);
        return `<div class="tlb"><span class="tdot" style="--to:${to}%"></span>` + b.marks.map((x,i)=>
          `<div class="mk ${i===f?'on':''}">
             <span class="when">${x.when}</span><span class="what">${x.what}</span>${blist(x.v)}
           </div>`).join('') + `</div>`; }
    case 'bignum':
      /* a density is a comparison, and a comparison wants two things beside each
         other, not one big number the room has to divide. Eight people, a rule,
         one robot — counted by the eye before the caption is read. */
      if(b.ratio) return `<div class="dens">
        <div class="crowd">
          ${Array.from({length:b.ratio.people},(_,i)=>
            `<svg style="--i:${i}" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-worker"></use></svg>`).join('')}
          <span class="bar"></span>
          <svg class="arm" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-arm"></use></svg>
        </div>
        <div class="cap"><b>${b.num}</b> ${b.unit}</div>
        ${bullets(b.list)}</div>`;
      return `<div class="bignum"><div class="n">${b.num}</div>
        <div class="side"><div class="unit">${b.unit}</div>${bullets(b.list)}</div></div>`;
    case 'doc':
      return `<div class="doc"><div class="hd">${b.doc.hd}</div>
        <div class="hdsub">${b.doc.hdsub}</div>` +
        b.doc.rows.map(r=>`<div class="ln ${r[2]}"><span>${r[0]}</span><span class="v">${r[1]}</span></div>`).join('') +
        `<div class="vd"><span>${b.doc.verdict[0]}</span><span>${b.doc.verdict[1]}</span></div>
         <div class="ft">${b.doc.ft}</div></div>`;
    case 'people':
      return `<div class="people">` + b.people.map(p=>
        `<div class="card">
           <div class="hdr"><img class="face" src="${p.img}" alt="${p.big}">
             <div><div class="k">${p.k}</div><div class="big">${p.big}</div></div></div>
           ${bullets(p.v)}
           <div class="org">${(p.orgs||[]).map(o=>`<img src="assets/brand/${o[0]}" alt="${o[1]}">`).join('')}</div>
         </div>`).join('') + `</div>`;
    case 'venn': {
      const n = b.show || 4;                       /* how many groups are up */
      const st = i => i < n ? (i === n-1 ? ' on new' : ' on') : '';
      return `<div class="venn">
        <div class="fig">
          <div class="c c1${st(0)}"><span>${b.circles[0]}</span></div>
          <div class="c c2${st(1)}"><span>${b.circles[1]}</span></div>
          <div class="c c3${st(2)}"><span>${b.circles[2]}</span></div>
          <div class="mid${n>=4?' on':''}">${b.centre}</div>
        </div>
        <div class="side">` + b.rows.map((r,i)=>
          `<div class="row${st(i)}"><span class="t">${r.t}</span>${blist(r.v)}</div>`).join('') +
        `</div></div>`;
    }
    default: return '';
  }
}

stage.innerHTML = BEATS.map((b,i)=>{
  if(b.kind==='cover') return `
    <section class="slide cover" data-i="${i}">
      <div class="row">
        <div class="txt">
          <div class="name"><img class="mark" src="assets/logo-mark.png" alt="">Physical <b>Spark</b></div>
          <p class="line">${b.line}</p>
          <div class="who">${b.who}</div>
        </div>
        <div class="media">
          <video src="assets/hero-rally.mp4" poster="assets/hero-rally-poster.jpg"
                 muted loop playsinline autoplay
                 aria-label="A robot arm running a mission on a bench"></video>
        </div>
      </div>
    </section>`;
  if(b.kind==='outro') return `
    <section class="slide outro" data-i="${i}">
      <div class="name"><img class="mark" src="assets/logo-mark.png" alt="">Physical <b>Spark</b></div>
      <p class="line">${b.line}</p>
      <div class="rule"></div>
      <div class="siteurl">physical-spark.bit-habit.com</div>
      <div class="row">
        <img class="qr" src="assets/brand/qr-site.svg" alt="QR code for physical-spark.bit-habit.com">
        <div class="livecard">
          <div class="lk">Live now</div>
          <div class="lb"><b>4 missions</b> &mdash; sim-first, no hardware needed</div>
          <div class="lb">A <b>10-hour</b> companion guide, with <b>80 pitfalls</b> already solved</div>
          <div class="lu">Jungmin Hong &nbsp;·&nbsp; Gichan Lee</div>
        </div>
      </div>
      <div class="thanks">Thank you.</div>
    </section>`;
  if(b.kind==='divider') return `
    <section class="slide divider" data-i="${i}">
      <h1>${b.head}</h1><p class="sub">${b.sub||''}</p>
      ${b.rail!==undefined?srail(b.rail,b.seed):''}
    </section>`;
  return `
    <section class="slide${b.layout?' lay-'+b.layout:''}${b.tight?' tight':''}" data-i="${i}">
      <div class="kick">
        <span class="n mono">${b.n}</span><span class="l">${b.section}</span>
        ${b.fix?`<span class="fix">FIX</span>`:''}
        <span class="rule"></span>
      </div>
      <h1>${b.head}</h1>${b.deco==='globe'?GLOBE:''}
      ${b.sub?`<p class="sub">${b.sub}</p>`:''}
      ${b.rail!==undefined?srail(b.rail):''}
      <div class="body">${bodyHTML(b)}</div>
      <div class="foot">
        <div class="src">${esc(b.note||b.src)}</div>
      </div>
    </section>`;
}).join('') + '<div class="pgno" id="pgno"></div>';

CHAPTERS.forEach(c=>{
  c.sec   = BEATS.slice(c.from, c.upto+1).reduce((s,b)=>s+b.sec,0);
  c.start = BEATS.slice(0, c.from).reduce((s,b)=>s+b.sec,0);
});
const TOTAL = BEATS.reduce((s,b)=>s+b.sec,0);
let idx=0, running=false, elapsed=0, tick=null;

const rail=document.getElementById('rail');
rail.innerHTML = CHAPTERS.map((c,i)=>
  `<span class="ch" style="--w:${c.sec};--c:${c.c}" onclick="jump(${c.from})">
     <span class="nm">${c.name}</span><span class="bar"><i></i></span></span>`).join('');

/* Count the headline figure up on entry. Pure CSS can animate a counter but cannot
   put the thousands comma in, and "1012" is not what the slide should end on — so
   this does it in JS and re-formats every frame. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el){
  const raw = el.dataset.n || (el.dataset.n = el.textContent);
  const m = raw.match(/[\d,]+/);
  const target = m ? +m[0].replace(/,/g,'') : 0;
  if(!m || !target || REDUCED){ el.textContent = raw; return; }
  const pre = raw.slice(0, m.index), post = raw.slice(m.index + m[0].length);
  const t0 = performance.now(), dur = 1400;
  (function step(t){
    const k = Math.min(1, (t - t0) / dur);
    el.textContent = pre + Math.round(target * (1 - Math.pow(1 - k, 3))).toLocaleString('en-US') + post;
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}

function render(){
  document.getElementById('pgno').innerHTML = `${idx+1}<small>&thinsp;/&thinsp;${BEATS.length}</small>`;
  document.querySelectorAll('.slide').forEach(el=>el.classList.toggle('on',+el.dataset.i===idx));
  document.documentElement.style.setProperty('--accent', chapterOf(idx).c);
  try{ history.replaceState(null,'','#'+(idx+1)); }catch(e){}
  const b=BEATS[idx];
  document.getElementById('pr-tag').textContent = `${idx+1} / ${BEATS.length} · ${b.section} · ${b.sec}s`;
  document.getElementById('pr-say').textContent = b.say || '— divider —';
  const words=(b.say||'').trim().split(/\s+/).filter(Boolean).length;
  const cap=Math.round(b.sec*WPS), wc=document.getElementById('pr-wc');
  wc.textContent=`${words}w / ~${cap}w`;
  wc.classList.toggle('over',words>cap);
  document.querySelectorAll('.slide.on .bignum .n').forEach(countUp);
  fitPrompter(); paint();
}
function paint(){
  CHAPTERS.forEach((c,i)=>{
    const el=rail.children[i], fill=el.querySelector('i');
    el.classList.toggle('live', idx>=c.from && idx<=c.upto);
    el.classList.toggle('done', idx>c.upto);
    /* the bar filled only from the clock, so with the timer off the chapter you
       are standing in stayed empty — and the last chapter never filled at all.
       Slide position fills it too; whichever is further along wins. */
    const byTime  = Math.max(0,Math.min(c.sec,elapsed-c.start)) / c.sec * 100;
    const bySlide = idx > c.upto ? 100
                  : idx < c.from ? 0
                  : BEATS.slice(c.from, idx+1).reduce((n,b)=>n+b.sec,0) / c.sec * 100;
    fill.style.width = Math.max(byTime, bySlide) + '%';
  });
  /* elapsed against the ten minutes, so overrunning is visible while it happens */
  const m=Math.floor(elapsed/60), sec=Math.floor(elapsed%60), el=document.getElementById('clock');
  el.textContent=`${m}:${String(sec).padStart(2,'0')} / ${Math.floor(TOTAL/60)}:${String(TOTAL%60).padStart(2,'0')}`;
  el.classList.toggle('over', elapsed>TOTAL);
}
/* the prompter grows with the script, so --btm is measured, never guessed */
function fitPrompter(){
  const pr=document.getElementById('pr');
  document.querySelector('.wrap').style.setProperty('--btm',
    pr.classList.contains('on') ? (52+pr.offsetHeight+8)+'px' : '52px');
}
function toggleTimer(){
  const off=document.body.classList.toggle('notime');
  document.getElementById('b-time').classList.toggle('on',!off);
}
function togglePrompter(){
  const on=document.getElementById('pr').classList.toggle('on');
  document.getElementById('b-script').classList.toggle('on',on);
  fitPrompter();
}
addEventListener('resize',fitPrompter);
function go(d){ idx=Math.max(0,Math.min(BEATS.length-1,idx+d)); render(); }
function jump(i){ idx=Math.max(0,Math.min(BEATS.length-1,i)); render(); }
function toggleRun(){
  running=!running;
  document.getElementById('b-run').innerHTML = running?'&#10074;&#10074; PAUSE':'&#9654; START';
  if(running) tick=setInterval(()=>{elapsed+=.1;paint();},100); else clearInterval(tick);
}
function reset(){ if(running) toggleRun(); elapsed=0; idx=0; render(); }
addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  else if(e.key.toLowerCase()==='s'){togglePrompter();}
  else if(e.key.toLowerCase()==='t'){toggleTimer();}
  else if(e.key.toLowerCase()==='r'){reset();}
  else if(e.key==='Enter'){toggleRun();}
});
const deep=parseInt(location.hash.slice(1),10);
if(deep>=1&&deep<=BEATS.length) idx=deep-1;
fitPrompter();      /* script starts folded away — S opens it when rehearsing */
render();
</script>
</body>
